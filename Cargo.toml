[workspace]
resolver = "2"
default-members = [
    "crates/ygo-policies",
    "crates/ygo-policies-ocgcore",
    "crates/ygo-policies-edopro",
    "crates/ygo-policies-ffi",
]
members = [
    "crates/ygo-policies",
    "crates/ygo-policies-ocgcore",
    "crates/ygo-policies-edopro",
    "crates/ygo-policies-ffi",
    "crates/ygo-policies-duel",
    "crates/ygo-policies-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ygo-policies = { path = "crates/ygo-policies" }
ygo-policies-ocgcore = { path = "crates/ygo-policies-ocgcore" }
ygo-policies-duel = { path = "crates/ygo-policies-duel" }

[profile.release]
debug = 1
