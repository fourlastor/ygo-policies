[package]
name = "ygo-policies-duel"
description = "OCGCore duels a caller steps: the engine build, card data and scripts, decks, snapshots and replay records"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["bundled"]
# The engine of `vendor/ocgcore`, compiled into the crate.  Without it every
# Core is an engine library loaded from a file (`Core::open`, `Core::load`).
bundled = ["dep:cc"]

[dependencies]
libloading = "0.8.9"
rusqlite.workspace = true
serde_json.workspace = true
ygo-policies-ocgcore.workspace = true

[dev-dependencies]
ygo-policies.workspace = true

[build-dependencies]
cc = { version = "1", optional = true }
